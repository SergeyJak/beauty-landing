name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Typecheck unit build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD: e2e-password
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD: e2e-password
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build for browser smoke
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke
        run: npm run test:e2e
