name: CI

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Typecheck unit build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD: e2e-password
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Persist generated lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/deterministic-node-deps'
        run: |
          cp package-lock.json /tmp/package-lock.json
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout "$GITHUB_HEAD_REF"
          cp /tmp/package-lock.json package-lock.json
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add deterministic package lock"
          git push origin HEAD:"$GITHUB_HEAD_REF"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Upload lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-candidate
          path: package-lock.json
          retention-days: 1
      - name: Upload Next build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Playwright smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD: e2e-password
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Download Next build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke
        run: npm run test:e2e
